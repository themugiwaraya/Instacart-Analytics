sql: "WITH top_users AS (\r\n  SELECT user_id\r\n  FROM orders\r\n  GROUP BY user_id\r\
  \n  ORDER BY COUNT(*) DESC\r\n  LIMIT 5\r\n)\r\nSELECT o.order_dow, o.user_id, COUNT(*)\
  \ AS orders_count\r\nFROM orders o\r\nJOIN top_users t ON o.user_id = t.user_id\r\
  \nGROUP BY o.order_dow, o.user_id\r\nORDER BY o.user_id, o.order_dow;\r\n"
