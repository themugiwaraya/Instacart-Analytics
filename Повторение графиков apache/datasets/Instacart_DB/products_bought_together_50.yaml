catalog: instacart_db
schema: public
sql: "WITH top_products AS (\r\n    SELECT p.product_id, p.product_name\r\n    FROM\
  \ order_products_prior opp\r\n    JOIN products p ON opp.product_id = p.product_id\r\
  \n    GROUP BY p.product_id, p.product_name\r\n    ORDER BY COUNT(*) DESC\r\n  \
  \  LIMIT 30\r\n)\r\nSELECT \r\n    CONCAT(p1.product_name, ' & ', p2.product_name)\
  \ AS product_pair,\r\n    COUNT(*) AS together_count\r\nFROM order_products_prior\
  \ opp1\r\nJOIN order_products_prior opp2 \r\n    ON opp1.order_id = opp2.order_id\
  \ AND opp1.product_id < opp2.product_id\r\nJOIN top_products p1 ON opp1.product_id\
  \ = p1.product_id\r\nJOIN top_products p2 ON opp2.product_id = p2.product_id\r\n\
  GROUP BY product_pair\r\nORDER BY together_count DESC\r\nLIMIT 15;\r\n"
