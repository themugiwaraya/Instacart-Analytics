sql: "SELECT a.aisle, COUNT(*) AS total_orders\r\nFROM order_products_prior opp\r\n\
  JOIN products p ON opp.product_id = p.product_id\r\nJOIN aisles a ON p.aisle_id\
  \ = a.aisle_id\r\nGROUP BY a.aisle\r\nORDER BY total_orders DESC\r\nLIMIT 10;\r\n"
