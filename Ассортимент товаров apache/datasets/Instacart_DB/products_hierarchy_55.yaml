sql: "SELECT \r\n    d.department AS department,\r\n    a.aisle AS aisle,\r\n    COUNT(p.product_id)\
  \ AS product_count\r\nFROM products p\r\nJOIN aisles a ON p.aisle_id = a.aisle_id\r\
  \nJOIN departments d ON p.department_id = d.department_id\r\nGROUP BY d.department,\
  \ a.aisle;\r\n"
