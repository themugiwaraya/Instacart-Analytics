sql: "SELECT\r\n  CASE\r\n    WHEN total_orders < 2000 THEN '\U0001F4C9 Slow days'\r\
  \n    WHEN total_orders BETWEEN 2000 AND 4000 THEN '\u2696\uFE0F Normal load'\r\n\
  \    ELSE '\U0001F680 Peak days'\r\n  END AS order_category,\r\n  SUM(total_orders)\
  \ AS total_orders_sum\r\nFROM orders_trend_db\r\nGROUP BY\r\n  CASE\r\n    WHEN\
  \ total_orders < 2000 THEN '\U0001F4C9 Slow days'\r\n    WHEN total_orders BETWEEN\
  \ 2000 AND 4000 THEN '\u2696\uFE0F Normal load'\r\n    ELSE '\U0001F680 Peak days'\r\
  \n  END\r\nORDER BY total_orders_sum DESC;\r\n"
