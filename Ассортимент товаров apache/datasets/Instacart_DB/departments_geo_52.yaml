sql: "SELECT \r\n  d.department_id,\r\n  d.department,\r\n  dc.latitude,\r\n  dc.longitude,\r\
  \n  COUNT(*) AS order_count\r\nFROM order_products_prior opp\r\nJOIN products p\
  \ ON opp.product_id = p.product_id\r\nJOIN departments d ON p.department_id = d.department_id\r\
  \nJOIN department_coordinates dc ON d.department_id = dc.department_id\r\nGROUP\
  \ BY d.department_id, d.department, dc.latitude, dc.longitude\r\nORDER BY order_count\
  \ DESC;\r\n"
