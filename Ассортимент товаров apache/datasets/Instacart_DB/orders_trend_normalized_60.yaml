schema: public
sql: "WITH stats AS (\r\n    SELECT \r\n        MIN(total_orders) AS min_val,\r\n\
  \        MAX(total_orders) AS max_val\r\n    FROM orders_trend_db\r\n)\r\nSELECT\
  \ \r\n    o.*,\r\n    (o.total_orders - s.min_val) / (s.max_val - s.min_val) AS\
  \ normalized_orders\r\nFROM orders_trend_db o\r\nCROSS JOIN stats s;\r\n"
